    <button class="theme-toggle" type="button" hidden>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z"/></svg>

    </button>
    <script>
      (() => {
        const root = document.documentElement;
        const button = document.querySelector(".theme-toggle");
        const system = matchMedia("(prefers-color-scheme: dark)");
        const current = () => root.dataset.theme || (system.matches ? "dark" : "light");
        const label = () => {
          const text = `Switch to ${current() === "dark" ? "light" : "dark"} mode`;
          button.setAttribute("aria-label", text);
          button.title = text;
        };
        button.addEventListener("click", () => {
          const theme = current() === "dark" ? "light" : "dark";
          root.dataset.theme = theme;
          try { localStorage.setItem("theme", theme); } catch {}
          label();
        });
        system.addEventListener("change", label);
        label();
        button.hidden = false;
      })();
    </script>
